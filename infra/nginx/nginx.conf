worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- rate limiting zones (OWASP: brute-force / DoS protection) ---
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=export_zone:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream sbdma_web { server web:3000; keepalive 32; }
    upstream sbdma_api { server api:8000; keepalive 32; }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name calibration.sbdma.gov.ye;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # --- security headers ---
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        limit_conn conn_limit 20;

        # auth endpoints are aggressively throttled
        location ~ ^/api/v1/auth/(login|refresh|reset) {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://sbdma_api;
            include /etc/nginx/proxy_params_sbdma;
        }

        # heavy PDF/Excel exports
        location ~ ^/api/v1/(reports|certificates)/.*(pdf|xlsx)$ {
            limit_req zone=export_zone burst=3;
            proxy_pass http://sbdma_api;
            proxy_read_timeout 300s;
            include /etc/nginx/proxy_params_sbdma;
        }

        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            proxy_pass http://sbdma_api;
            include /etc/nginx/proxy_params_sbdma;
        }

        location / {
            proxy_pass http://sbdma_web;
            include /etc/nginx/proxy_params_sbdma;
        }

        location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    }
}
