apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbdma-api
  labels: { app: sbdma-api, tier: backend }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # zero-downtime
  selector:
    matchLabels: { app: sbdma-api }
  template:
    metadata:
      labels: { app: sbdma-api, tier: backend }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, fsGroup: 1001 }
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: ghcr.io/tadkeera/sbdma-calibration-api:2.4.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - secretRef: { name: sbdma-secrets }
            - configMapRef: { name: sbdma-config }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: '1',  memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            initialDelaySeconds: 25
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: storage, mountPath: /srv/storage }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: storage, persistentVolumeClaim: { claimName: sbdma-storage } }
---
apiVersion: v1
kind: Service
metadata:
  name: sbdma-api
spec:
  type: ClusterIP
  selector: { app: sbdma-api }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sbdma-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sbdma-api }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Percent, value: 25, periodSeconds: 60 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sbdma-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: sbdma-api }
